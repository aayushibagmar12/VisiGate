<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <meta name="description" content="User registration form with dynamic ID selection.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <script src="login-guard.js"></script>
    <div class="form-container">
        <h1>Registration Form</h1>
        <p class="subtitle">Please provide your details below.</p>
        
        <form id="registration-form">
            <div class="input-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Aarav Sharma" required>
            </div>
            
            <div class="input-group">
                <label for="age">Age</label>
                <input type="number" id="age" name="age" placeholder="25" min="1" max="120" required>
            </div>
            
            <div class="input-group">
                <label for="mobile">Mobile Number</label>
                <input type="tel" id="mobile" name="mobile" placeholder="9876543210" pattern="[0-9]{10}" title="Please enter a 10-digit mobile number" required>
            </div>
            
            <div class="input-group">
                <label for="accompanying">Number of People Accompanying</label>
                <input type="number" id="accompanying" name="accompanying" placeholder="0" min="0" value="0" required>
            </div>

            <div class="input-group">
                <label>Bringing a Vehicle Inside Campus?</label>
                <div style="display:flex; gap:16px; margin-top:6px;">
                    <label style="display:flex; align-items:center; gap:6px; font-weight:normal;">
                        <input type="radio" name="bringing-vehicle" value="yes" id="vehicle-yes"> Yes
                    </label>
                    <label style="display:flex; align-items:center; gap:6px; font-weight:normal;">
                        <input type="radio" name="bringing-vehicle" value="no" id="vehicle-no" checked> No
                    </label>
                </div>
            </div>

            <div class="input-group" id="vehicle-number-container" style="display:none;">
                <label for="vehicle-number">Vehicle Number</label>
                <input type="text" id="vehicle-number" name="vehicle-number" placeholder="e.g., DL01AB1234">
            </div>

            <div class="input-group">
                <label>Face Photo</label>
                <div style="display:flex; gap:10px; margin-top:6px;">
                    <button type="button" class="submit-btn" id="btn-open-camera" style="background:#f3f4f6; color:#374151;">Take Photo</button>
                </div>
                <div id="face-preview-wrap" style="display:none; margin-top:10px;">
                    <img id="face-photo-preview" src="" alt="Face preview" style="width:100%; border-radius:8px;">
                    <button type="button" class="submit-btn" id="btn-retake-face" style="background:#f3f4f6; color:#374151; margin-top:8px;">Retake / Choose Again</button>
                </div>
                <p class="error-text" id="face-photo-error" style="display:none;"></p>
            </div>

            <button type="submit" class="submit-btn">Submit</button>        </form>
    </div>

    <!-- ═══ CAMERA MODAL ═══ -->
    <div class="modal-overlay" id="cameraModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:999; flex-direction:column; align-items:center; justify-content:center;">
        <div style="background:#fff; width:90%; max-width:400px; padding:20px; border-radius:12px; text-align:center;">
            <h3 style="margin-bottom:10px;">Take Your Photo</h3>
            <p style="font-size:0.85rem; color:#6b7280; margin-bottom:16px;">Make sure your face is clearly visible.</p>
            <video id="modal-video" autoplay playsinline style="width:100%; border-radius:8px; background:#000; min-height:200px;"></video>
            <canvas id="modal-canvas" style="display:none;"></canvas>
            <div style="display:flex; gap:10px; margin-top:16px;">
                <button type="button" class="submit-btn" id="btn-modal-cancel" style="background:#f3f4f6; color:#374151; flex:1;">Cancel</button>
                <button type="button" class="submit-btn" id="btn-modal-snap" style="flex:1;">Capture</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
